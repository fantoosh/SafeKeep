{% extends "layout.html" %}
{% block title %}SafeKeep — Not found{% endblock %}

<div style="display:flex;align-items:center;justify-content:center;height:calc(100vh - 52px);text-align:center;padding:40px;">
  <div>
    <div style="font-family:var(--font-mono);font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--ink-4);margin-bottom:10px;">404</div>
    <div style="font-size:22px;font-weight:600;letter-spacing:-0.015em;color:var(--ink);margin-bottom:6px;">Page not found</div>
    <div style="font-size:13px;color:var(--ink-3);margin-bottom:22px;">The page you're looking for doesn't exist.</div>
    <a href="/" class="btn btn-primary">Back to home</a>
  </div>
</div>
